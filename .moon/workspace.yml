# https://moonrepo.dev/docs/config/workspace
$schema: './cache/schemas/workspace.json'

# extends: './shared/workspace.yml'

projects:
  - 'apps/*'
  - 'packages/*'
vcs:
  manager: 'git'
  defaultBranch: 'dev'

# Extensions for migration
extensions:
  migrate-turborepo:
    plugin: 'github://moonrepo/moon-extensions/migrate-turborepo@moon_migrate_turborepo_extension-v0.1.4'
