# =============================================================================
# pnpm Workspace Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Monorepo Structure
# -----------------------------------------------------------------------------

# Define which directories contain workspace packages.
# Turborepo orchestrates builds across these packages.
packages:
  - "apps/*" # Next.js client, Express server, React Native mobile, Storybook
  - "packages/*" # Shared: api-types, ui, typescript-config

# -----------------------------------------------------------------------------
# Supply Chain Security
# -----------------------------------------------------------------------------

# Only allow package versions that have been published for at least 7 days
# (10080 minutes). Mitigates attacks using freshly published malicious versions.
# See: https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # TODO: Remove after 2026-04-15 once @getbrevo/brevo@5.0.1 is older than 7 days
  - "@getbrevo/brevo"
  # TODO: Remove after 2026-04-03 once @chromatic-com/storybook@5.1.1 is older than 7 days
  - "@chromatic-com/storybook"
  # TODO: Remove after 2026-03-30 once Storybook 10.3.3 is older than 7 days
  - "@storybook/*"
  - "storybook"
  # TODO: Remove after 2026-03-30 once flatted@3.4.2 is older than 7 days
  - flatted
  # TODO: Remove after 2026-04-03 once handlebars@4.7.9 is older than 7 days (security fix)
  - handlebars
  # TODO: Remove after 2026-04-03 once brace-expansion@2.0.3 is older than 7 days (security fix)
  - brace-expansion
  # TODO: Remove after 2026-03-31 once node-forge@1.4.0 is older than 7 days (security fix)
  - node-forge
  # TODO: Remove after 2026-06-19 once esbuild@0.28.1 is older than 7 days (security fix)
  # Scoped to the single 0.28.1 release so future esbuild releases still go through
  # the minimumReleaseAge quarantine. pnpm rejects glob + version unions
  # ('@esbuild/*@0.28.1' throws NAME_PATTERN_IN_VERSION_UNION), so the platform
  # packages are enumerated explicitly.
  - esbuild@0.28.1
  - '@esbuild/aix-ppc64@0.28.1'
  - '@esbuild/android-arm@0.28.1'
  - '@esbuild/android-arm64@0.28.1'
  - '@esbuild/android-x64@0.28.1'
  - '@esbuild/darwin-arm64@0.28.1'
  - '@esbuild/darwin-x64@0.28.1'
  - '@esbuild/freebsd-arm64@0.28.1'
  - '@esbuild/freebsd-x64@0.28.1'
  - '@esbuild/linux-arm@0.28.1'
  - '@esbuild/linux-arm64@0.28.1'
  - '@esbuild/linux-ia32@0.28.1'
  - '@esbuild/linux-loong64@0.28.1'
  - '@esbuild/linux-mips64el@0.28.1'
  - '@esbuild/linux-ppc64@0.28.1'
  - '@esbuild/linux-riscv64@0.28.1'
  - '@esbuild/linux-s390x@0.28.1'
  - '@esbuild/linux-x64@0.28.1'
  - '@esbuild/netbsd-arm64@0.28.1'
  - '@esbuild/netbsd-x64@0.28.1'
  - '@esbuild/openbsd-arm64@0.28.1'
  - '@esbuild/openbsd-x64@0.28.1'
  - '@esbuild/openharmony-arm64@0.28.1'
  - '@esbuild/sunos-x64@0.28.1'
  - '@esbuild/win32-arm64@0.28.1'
  - '@esbuild/win32-ia32@0.28.1'
  - '@esbuild/win32-x64@0.28.1'
  # TODO: Remove - pnpm false positive for old packages
  - "@babel/core"
  - path-expression-matcher
  - rollup
  # TODO: Remove after 2026-04-06 once Biome 2.4.10 is older than 7 days
  - "@biomejs/cli-darwin-arm64"
  - "@biomejs/cli-darwin-x64"
  - "@biomejs/cli-linux-arm64"
  - "@biomejs/cli-linux-x64"
  - "@biomejs/cli-win32-arm64"
  - "@biomejs/cli-win32-x64"
  - "@biomejs/cli-linux-arm64-musl"
  - "@biomejs/cli-linux-x64-musl"
  - "@emnapi/runtime"
  - sharp
  - image-size
  # TODO: Remove after 2026-04-02 once path-to-regexp@8.4.0 and 0.1.13 are older than 7 days (security fix)
  - path-to-regexp
  # TODO: Remove after 2026-04-02 once @smithy/config-resolver@4.4.13 is older than 7 days (security fix)
  - "@smithy/config-resolver"
  # TODO: Remove after 2026-04-07 once @xmldom/xmldom@0.8.12 is older than 7 days (security fix)
  - "@xmldom/xmldom"
  # TODO: Remove after 2026-04-07 once picomatch security fixes are older than 7 days
  - picomatch
  # TODO: Remove after 2026-04-07 once smol-toml@1.6.1 is older than 7 days (security fix)
  - smol-toml
  # TODO: Remove after 2026-04-07 once yaml@2.8.3 is older than 7 days (security fix)
  - yaml
  # TODO: Remove after 2026-04-11 once lodash@4.18.1 is older than 7 days (security fix, published 2026-03-31)
  - lodash
  # TODO: Remove after 2026-04-11 once @hapi/content@6.0.1 is older than 7 days (security fix, published 2026-04-02)
