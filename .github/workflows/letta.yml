name: Letta Code
# One automation on the agent `vars.LETTA_AGENT_ID` (shared with playground),
# with several entry points:
#   - PR opened / reopened / synchronize / ready_for_review: a review pass
#     fires automatically, no mention required.
#   - New issues, or the `letta-code` label.
#   - Comments and review comments, but only when they mention `@letta-code`.
# `prompt:` is set, so the action always picks its "agent" mode — including for
# mentions (src/modes/detector.ts returns "agent" as soon as `prompt` is set).
# A mention therefore buys another review pass in the same thread, not a
# branch-pushing interactive session. The agent resumes the conversation it
# opened for this PR (matched on the summary `owner/repo/pr-<n>`). See
# https://github.com/letta-ai/letta-code-action#automated-workflows
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: letta-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  letta:
    # Skip Dependabot auto-bumps only. We deliberately do NOT use
    # `github.event.sender.type != 'Bot'` because that would also exclude
    # release-please, future automation bots, and the action's own
    # github-actions identity, all of which may legitimately need a review.
    #
    # Label events are restricted to the `letta-code` label. It does not exist
    # in this repo, so in practice no label ever triggers a pass — which is the
    # point: without this clause, adding ANY label started a full review pass,
    # including release-please's "autorelease: pending" / "autorelease: tagged"
    # on release PRs.
    #
    # Comment events additionally require an explicit `@letta-code` mention.
    # Without that gate, every new comment started a full review pass: status
    # comments, other review bots, and the agent's own replies to the author.
    # PR events (opened / synchronize / reopened) are untouched, so
    # release-please PRs are still reviewed on open and incremental reviews
    # still fire when commits land.
    if: >-
      github.event.sender.login != 'dependabot[bot]' &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'letta-code') &&
      (github.event_name != 'issue_comment' &&
       github.event_name != 'pull_request_review_comment' ||
       contains(github.event.comment.body, '@letta-code'))
    runs-on: ubuntu-latest
    # Review only: the agent comments, it does not commit or push. On agent
    # mode this job never pushes, so `contents: read` costs nothing and makes
    # the boundary structural rather than a prompt-level promise.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install the Letta Code CLI from npm. The action's bundled binary can
      # lag behind @letta-ai/letta-code on npm, so we install explicitly and
      # pass the resolved path via path_to_letta_executable. We deliberately
      # use `@latest`: getting the freshest CLI is the whole point of this
      # step. Supply-chain risk is accepted as a trade-off, but it is bounded
      # by this job's permissions: a compromised package can read the repo and
      # post comments, not push. Mitigation lives upstream (Letta's npm
      # publishing process) rather than in pin/version policy.
      # https://github.com/letta-ai/letta-code-action#using-the-latest-cli
      - name: Install Letta Code CLI
        id: letta-bin
        run: |
          npm install -g @letta-ai/letta-code@latest
          echo "path=$(command -v letta)" >> "$GITHUB_OUTPUT"

      # Pinned to a commit on main instead of a tag. `@v0` and `v0.0.6` both
      # resolve to b50e45b (2026-04-15), where agent mode emitted neither
      # `agent_id` nor `conversation_id` — only tag mode did. So
      # `LETTA_AGENT_ID` reached the runner empty, it fell back to
      # auto-discovery, and every run created a fresh agent with no
      # conversation to resume. On b7e51ed (2026-09-15) agent mode reads
      # `agent_id`, resolves the existing conversation and sets `is_followup`,
      # which is what makes the inputs below effective. No upstream tag covers
      # this revision: bump the SHA, do not go back to a floating tag.
      # Dependabot's `github-actions` ecosystem keeps it moving.
      - uses: letta-ai/letta-code-action@b7e51edb0643e67ae74327a1cdf0c332e549f8fc
        with:
          letta_api_key: ${{ secrets.LETTA_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Read in agent mode on the pinned revision. Do NOT smuggle this
          # through `letta_args` as `--agent <id>`: run-letta.ts treats a
          # user-supplied `--agent` as "switch agent" and appends `--new`,
          # discarding the conversation_id the action just resolved.
          agent_id: ${{ vars.LETTA_AGENT_ID }}
          # Force a fresh conversation, matching playground. This is a
          # workaround, and reverting it is the point of the upstream issue
          # linked in this PR.
          #
          # Why not resume: `run-letta.ts` on b7e51ed pushes `--conversation
          # <id>` (a send to the agent's Cloud harness) and, because
          # `environment` is empty, still appends `--yolo`. The CLI (>= 0.32.5)
          # rejects that pair before doing anything:
          #   "--yolo configures local execution and is not supported when
          #    sending to an existing Cloud harness."
          # The step then exits 1 with `num_turns: 0` and produces no review —
          # which is why every run after the first one on a PR was red.
          #
          # Why not `environment: cloud`: setting it makes the command valid
          # and the conversation does resume (delta-only `followup_prompt`),
          # but the turn then executes on the agent's Cloud harness, which has
          # no GitHub credentials for this repo. Verified 2026-09-21: the check
          # went green and the agent wrote a correct review, but nothing was
          # posted to the PR. A green check with no visible review is worse
          # than a red one, so runner execution wins until upstream omits
          # local-execution flags on the `--conversation` branch.
          #
          # Cost of `--new`: every review pass starts from scratch, with no
          # memory of its own earlier findings. The prompt compensates by
          # refusing to re-raise anything already in this PR's review threads.
          letta_args: --new
          # "auto" lets the Letta platform pick the model for the task.
          model: auto
          path_to_letta_executable: ${{ steps.letta-bin.outputs.path }}
          # Auto-review prompt. The agent already has karfur context in
          # memory (architecture, AGENTS.md, gotchas, conventions), so this
          # prompt focuses on review behaviour rather than restating the
          # project. Review comments target the French-speaking team.
          prompt: |
            You are reviewing a pull request on the Réfugiés.info (karfur) monorepo.
            Write your review comments in French (the team is French-speaking);
            keep code suggestions and identifiers in English.

            Coding conventions are part of this review, not background reading.
            `CLAUDE.md` — the coding-conventions document (RI-1437) — is the
            primary source, alongside `documentation/README.md` (standards),
            `CONTRIBUTING.md` (branching, PR process, commit prefixes),
            `AGENTS.md` and `.specify/memory/constitution.md`. A PR that
            contradicts them must be flagged (see area 10), and a review that
            never opens them is incomplete. Where a doc disagrees with the real
            codebase, say so instead of enforcing the stale rule — the toolchain
            has moved in the past without the doc following.

            Scope of `CLAUDE.md`'s "everything in English" rule: it governs
            code, code comments and commit messages. Do not flag French PR or
            issue text — French is the team's working language there.

            Review only. Never edit, commit or push: this job has read-only
            repository access, and "helpfully" fixing the PR on your own
            initiative puts an unrelated commit on someone else's branch.

            Budget — treat this as a hard constraint. A review that restates
            the diff costs the author more than it gives them:
            - One pass. No summary comment, no re-stating of the diff, no
              praise padding, no tables.
            - Review body: 5 bullets maximum, in the region of 1200 characters.
            - Inline comments: 5 maximum, reserved for what blocks merge or
              risks a production incident. Fold nits into a single bullet; do
              not file what Biome already enforces.
            - Never re-raise a finding that already exists in a review thread
              on this PR, and say nothing about what the author has since
              fixed.
            - If nothing blocks merge, say so in one sentence and approve.

            Focus areas — only flag what blocks merge or risks a production incident:
            1. Accessibility (RGAA 4): semantic HTML, ARIA roles/labels, keyboard
               navigation, focus management, live-region announcements (useAnnounce),
               form labels, alt text, error messages, heading hierarchy.
            2. Internationalisation: no hardcoded user-facing strings (must use the
               i18n system), variable text length handled, RTL for Arabic/Dari/Pashto
               when relevant.
            3. DSFR compliance: uses react-dsfr tokens/components, no arbitrary
               values, custom CSS extends DSFR rather than replacing it.
            4. Security: input validation, secrets never committed, dependency CVEs
               addressed via pnpm.overrides at the repo root.
            5. Conventional Commits: PR title follows type(scope): format (this is
               the squash-merge message release-please consumes).
            6. Monorepo hygiene: pnpm only, no npm/yarn, cross-package deps explicit,
               shared types in @refugies-info/api-types, shared UI in
               @refugies-info/ui, ~ alias for client/lib imports.
            7. Backend safety: Mongoose 8 .lean() on populated documents, no
               z.record() without .lean() in repository methods, server awaits
               DB/cache init before app.listen (race condition).
            8. i18n keys: user-facing copy uses i18n keys, not literals.
            9. Diff hygiene: every changed line should trace to the PR's stated
               scope — flag whole-file Biome/Prettier reformats, unrelated
               refactors, renames or formatting sweeps bundled with a fix.
            10. Coding conventions (`CLAUDE.md`, `documentation/README.md`):
               camelCase variables/functions, PascalCase components, named
               exports only, descriptive names over cryptic ones; code, code
               comments and commit messages in concise English; new/touched code
               fully typed; reuse an existing function instead of copy-pasting;
               presentational components free of business logic and never
               fetching data directly (data arrives via props); SCSS modules +
               Tailwind/DSFR tokens — the documented
               `stylelint-disable-next-line selector-class-pattern` above
               `:global()` react-dsfr BEM selectors is an accepted pattern, not
               a violation; server logging via `logger.*("[fn]", { data })`,
               never log in client render. New code uses App Router + Tailwind +
               Context API + Zod schemas rather than the legacy Pages Router /
               SCSS / Redux / TypeGoose stack.

            Be surgical. Do not block the PR for stylistic nits or refactoring
            opportunities — call those out as suggestion comments only. If the PR
            is clean for its stated scope, say so briefly and approve.

            Comment on the pull request itself. Each pass runs on a fresh
            conversation, so anything you want the author to see has to be a
            comment on this PR — never a note to yourself.
          # Deliberately no `followup_prompt` here, matching playground. Agent
          # mode sets `is_followup` from the summary lookup, which runs whether
          # or not `--new` is passed, and the action prefers `followup_prompt`
          # over `prompt` whenever it is set. With `--new` there is no prior
          # review to diff against, so a follow-up prompt would mean a delta
          # review of nothing. Re-add it only together with real conversation
          # resumption.
