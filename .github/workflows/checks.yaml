name: Checks

on:
  pull_request:
    branches-ignore:
      - master-mobile
      - master-frontend
      - master-backend
      - staging-mobile
      - staging-frontend
      - staging-backend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.13.1"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4+sha512.c8180b3fbe4e4bca02c94234717896b5529740a6cbadf19fa78254270403ea2f27d4e1d46a08a0f56c89b63dc8ebfd3ee53326da720273794e6200fcf0d184ab

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, Check Types and Test
        run: turbo lint check:types test && pnpm lint:style
        env:
          NEXT_PUBLIC_REACT_APP_ENV: ${{ vars.NEXT_PUBLIC_REACT_APP_ENV }}
          NEXT_PUBLIC_REACT_APP_ALGOLIA_API_KEY: ${{ vars.NEXT_PUBLIC_REACT_APP_ALGOLIA_API_KEY }}
          NEXT_PUBLIC_REACT_APP_ALGOLIA_INDEX_STG: ${{ vars.NEXT_PUBLIC_REACT_APP_ALGOLIA_INDEX_STG }}
