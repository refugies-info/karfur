name: Build Mobile Staging
on:
  # We only want to run this workflow when a push is made to the
  # staging-mobile branch and the changes include a change to the
  # mobile app or the API types.
  push:
    branches:
      - staging-mobile
    paths:
      - yarn.lock
      - package.json
      - apps/mobile/**
      - packages/api-types/**
  workflow_dispatch:

jobs:
  update:
    name: Build Mobile Staging
    runs-on: ubuntu-latest
    environment: staging-mobile
    env:
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      ALGOLIA_INDEX: ${{ vars.ALGOLIA_INDEX }}
      API_URL: ${{ vars.API_URL }}
      ENV_NAME: DEVELOPMENT
      EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
      EXPO_IOS_ASC_APP_ID: ${{ secrets.EXPO_IOS_ASC_APP_ID}}
      EXPO_IOS_APPLE_TEAM_ID: ${{ secrets.EXPO_IOS_APPLE_TEAM_ID }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SITE_SECRET: ${{ secrets.SITE_SECRET }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.13.1"
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Find yarn cache
        id: yarn-cache-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup GCP service account key
        run: echo '${{ secrets.EXPO_SERVICE_ACCOUNT_KEY}}'  | base64 --decode > apps/mobile/refugies-info-appkey.json

      - name: Build app on both platforms
        working-directory: ./apps/mobile
        run: eas build --platform all --profile staging --auto --non-interactive --no-wait
