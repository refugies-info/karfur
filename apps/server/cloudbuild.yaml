steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY_URL}/$PROJECT_ID/${_REGISTRY}/${_COMPONENT}:$SHORT_SHA"
      - "-t"
      - "${_REGISTRY_URL}/$PROJECT_ID/${_REGISTRY}/${_COMPONENT}:latest"
      - "-f"
      - "./apps/server/Dockerfile"
      - "."
  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGISTRY_URL}/$PROJECT_ID/${_REGISTRY}/${_COMPONENT}:$SHORT_SHA"
  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - -c
      - |
        # Use array for optional command-line arguments (Google Shell Style Guide)
        # https://google.github.io/styleguide/shellguide.html#arrays
        vpc_args=()
        if [[ -n "${_VPC_CONNECTOR}" ]]; then
          vpc_args=(--vpc-connector="${_VPC_CONNECTOR}" --vpc-egress=private-ranges-only)
        fi

        gcloud run deploy ${_COMPONENT}-${_ENV} \
          --allow-unauthenticated \
          --image ${_REGISTRY_URL}/$PROJECT_ID/${_REGISTRY}/${_COMPONENT}:$SHORT_SHA \
          --max-instances ${_MAX_INSTANCES} \
          --memory ${_MEMORY} \
          --platform managed \
          --project ${_PROJECT_NAME} \
          --region ${_REGION} \
          --service-account ${_SA} \
          --set-env-vars MINIMUM_APP_VERSION=${_MINIMUM_APP_VERSION} \
          --set-env-vars NODE_ENV=${_NODE_ENV} \
          --set-env-vars NODE_OPTIONS="--max-old-space-size=${_NODE_HEAP_SIZE}" \
          --set-secrets accountSid=accountSid:latest \
          --set-secrets AIRTABLE_BASE_CONTENU=${_AIRTABLE_BASE_CONTENU_VAR}:latest \
          --set-secrets AIRTABLE_BASE_TRAD=${_AIRTABLE_BASE_TRAD_VAR}:latest \
          --set-secrets AIRTABLE_BASE_USERS=AIRTABLE_BASE_USERS:latest \
          --set-secrets AIRTABLE_TOKEN=AIRTABLE_TOKEN:latest \
          --set-secrets ALGOLIA_API_KEY=ALGOLIA_API_KEY:latest \
          --set-secrets ALGOLIA_INDEX=${_ALGOLIA_INDEX_VAR}:latest \
          --set-secrets API_KEY=API_KEY:latest \
          --set-secrets API_SECRET=API_SECRET:latest \
          --set-secrets authToken=authToken:latest \
          --set-secrets BREVO_API_KEY=BREVO_API_KEY:latest \
          --set-secrets CLOUD_NAME=CLOUD_NAME:latest \
          --set-secrets CRON_TOKEN=CRON_TOKEN:latest \
          --set-secrets EXPO_ACCESS_TOKEN=EXPO_ACCESS_TOKEN:latest \
          --set-secrets FRONT_SITE_URL=${_FRONT_URL_VAR}:latest \
          --set-secrets GCLOUD_CLIENT_EMAIL=GCLOUD_CLIENT_EMAIL:latest \
          --set-secrets GCLOUD_CLIENT_ID=GCLOUD_CLIENT_ID:latest \
          --set-secrets GCLOUD_CLIENT_X509=GCLOUD_CLIENT_X509:latest \
          --set-secrets GCLOUD_PKEY=GCLOUD_PKEY:latest \
          --set-secrets GCLOUD_PRIVATE_KEY_ID=GCLOUD_PRIVATE_KEY_ID:latest \
          --set-secrets GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest \
          --set-secrets GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest \
          --set-secrets MICROSOFT_CLIENT_ID=MICROSOFT_CLIENT_ID:latest \
          --set-secrets MICROSOFT_CLIENT_SECRET=MICROSOFT_CLIENT_SECRET:latest \
          --set-secrets MONGODB_URI=${_MONGODB_VAR}:latest \
          --set-secrets REDIS_URI=${_REDIS_URI_VAR}:latest \
          --set-secrets POSTMAN_SECRET=POSTMAN_SECRET:latest \
          --set-secrets REACT_APP_SITE_SECRET=REACT_APP_SITE_SECRET:latest \
          --set-secrets SECRET=SECRET:latest \
          --set-secrets SENDGRID_API_KEY=SENDGRID_API_KEY:latest \
          --set-secrets SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest \
          --set-secrets SMS_SENDER=SMS_SENDER:latest \
          --set-secrets TTS_KEY_1=TTS_KEY_1:latest \
          "${vpc_args[@]}"

substitutions:
  _MAX_INSTANCES: "20"
  _REDIS_URI_VAR: REDIS_URI

options:
  dynamicSubstitutions: true
  machineType: "E2_HIGHCPU_8"
